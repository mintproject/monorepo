name: Ensemble Manager

# No path filter. GitHub path filters are workflow-level, not job-level, so a
# filtered `test` job and an unfiltered `publish` job cannot share a file, and a
# `publish` job in a second file cannot `needs:` a `test` job in the first.
# Filtering therefore costs the publish gate. The gate is worth more: every
# single-repo commit builds an image for every service, so one tag names the
# whole system state.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [develop, main]

env:
  IMAGE: ghcr.io/mintproject/ensemble-manager

defaults:
  run:
    working-directory: mint-ensemble-manager

concurrency:
  group: mint-ensemble-manager-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24 matches mint-ensemble-manager/Dockerfile. Testing on a Node the
      # image does not use gives a green build that fails in the cluster.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mint-ensemble-manager/package-lock.json

      - run: npm ci

      - run: npx tsc --noEmit

      - run: npm test

      # No lint or format job. The service carries 475 eslint errors and 74
      # unformatted files. `eslint:fix` and `prettier:fix` stay for manual use.

  publish:
    name: Publish image
    needs: [test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute sanitized branch tag
        run: |
          SAFE_BRANCH="${GITHUB_REF_NAME}"
          # Docker tags forbid '/', so feature branches publish rather than fail.
          echo "SAFE_BRANCH=${SAFE_BRANCH//\//-}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Dockerfile does COPY . ., so the build context is the service
      # directory, not the repository root.
      - uses: docker/build-push-action@v6
        with:
          push: true
          context: mint-ensemble-manager
          file: mint-ensemble-manager/Dockerfile
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ env.SAFE_BRANCH }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Retag, do not rebuild. A second build would ship an artifact no test saw.
      - name: Tag the default branch as latest
        if: github.ref_name == github.event.repository.default_branch
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:latest" "${IMAGE}:${GITHUB_SHA}"

  scan:
    name: Scan image
    needs: [publish]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          # Reporting only. A vulnerable base image must not block a deploy.
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload to the Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: mint-ensemble-manager
