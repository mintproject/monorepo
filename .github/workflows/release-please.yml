name: Release Please

# One version for the whole repository. Every single-repo commit builds all
# four services, so one tag names the whole system state.
#
# `release-as` and `bootstrap-sha` came off after the first release, 0.1.0 on
# 2026-08-30. Both were bootstrap settings. `release-as` fixed the version at
# 0.1.0, and `bootstrap-sha` stopped the changelog walk at the last commit
# before the three service histories were imported. release-please now anchors
# on the `chore(main): release 0.1.0` commit, so it computes the next version
# from the conventional commits after it. See monorepo#282.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # Pinned. The action defaults to the repository default branch, which
          # is `develop`. Releases are cut from `main`, the production line.
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
