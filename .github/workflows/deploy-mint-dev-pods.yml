name: Deploy MINT Dev Pods

on:
  workflow_run:
    workflows: [MINT Dev Images]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: GHCR image tag to deploy
        required: true
        default: develop
        type: string
      pod_prefix:
        description: Optional lowercase prefix for an isolated pod stack
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: mint-dev-pods
  cancel-in-progress: false

jobs:
  restart:
    name: Restart MINT dev application pods
    runs-on: ubuntu-latest
    environment: Tapis Dev Deploy
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'develop')
      }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deploy dependencies
        run: pip install tapipy python-dotenv

      - name: Update PostgreSQL and Hasura pod definitions
        env:
          TAPIS_USERNAME: ${{ secrets.TAPIS_USERNAME }}
          TAPIS_ID: ${{ secrets.TAPIS_ID }}
          TAPIS_PASSWORD: ${{ secrets.TAPIS_PASSWORD }}
          MINTDEV_POSTGRES_PASSWORD: ${{ secrets.MINTDEV_POSTGRES_PASSWORD }}
          HASURA_GRAPHQL_ADMIN_SECRET: ${{ secrets.HASURA_GRAPHQL_ADMIN_SECRET }}
          IMAGE_TAG: ${{ inputs.image_tag || 'develop' }}
          MINT_TEST_STACK_PREFIX: ${{ inputs.pod_prefix || '' }}
        run: >-
          bash -c '
          STACK_SCRIPT=deploy/tapis/register_mint_stack.py;
          if [[ -n "$MINT_TEST_STACK_PREFIX" ]]; then STACK_SCRIPT=deploy/tapis/register_mint_test_stack.py; fi;
          python "$STACK_SCRIPT"
          --image-tag "$IMAGE_TAG"
          --pods postgres,graphql
          --restart-pods postgres,graphql
          --migrate-postgres-image'

      - name: Log in to GHCR for Hasura migration client
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply Hasura migrations
        env:
          HASURA_GRAPHQL_ADMIN_SECRET: ${{ secrets.HASURA_GRAPHQL_ADMIN_SECRET }}
          MINT_TEST_STACK_PREFIX: ${{ inputs.pod_prefix || '' }}
          IMAGE_TAG: ${{ inputs.image_tag || 'develop' }}
        run: |
          set -euo pipefail
          STACK_PREFIX="${MINT_TEST_STACK_PREFIX:-mintdev}"
          GRAPHQL_ENDPOINT="https://${STACK_PREFIX}graphql.pods.portals.tapis.io"

          # Tapis starts the pod asynchronously. Wait for the endpoint before
          # asking the CLI to connect, with a bounded retry window.
          curl --fail --silent --show-error --retry 30 --retry-delay 5 \
            --retry-all-errors "$GRAPHQL_ENDPOINT/healthz" >/dev/null

          # The image contains the CLI and the /hasura project. Running the
          # same resolved tag keeps migrations and metadata aligned with the
          # GraphQL image that was just deployed.
          docker run --rm --pull=always \
            --entrypoint hasura \
            --workdir /hasura \
            --env HASURA_GRAPHQL_ENDPOINT="$GRAPHQL_ENDPOINT" \
            --env HASURA_GRAPHQL_ADMIN_SECRET \
            "ghcr.io/mintproject/graphql-engine:$IMAGE_TAG" \
            migrate status --skip-update-check

          docker run --rm --pull=always \
            --entrypoint hasura \
            --workdir /hasura \
            --env HASURA_GRAPHQL_ENDPOINT="$GRAPHQL_ENDPOINT" \
            --env HASURA_GRAPHQL_ADMIN_SECRET \
            "ghcr.io/mintproject/graphql-engine:$IMAGE_TAG" \
            migrate apply --skip-update-check

      - name: Start Model Catalog API then restart Hasura endpoint
        env:
          TAPIS_USERNAME: ${{ secrets.TAPIS_USERNAME }}
          TAPIS_ID: ${{ secrets.TAPIS_ID }}
          TAPIS_PASSWORD: ${{ secrets.TAPIS_PASSWORD }}
          MINTDEV_POSTGRES_PASSWORD: ${{ secrets.MINTDEV_POSTGRES_PASSWORD }}
          HASURA_GRAPHQL_ADMIN_SECRET: ${{ secrets.HASURA_GRAPHQL_ADMIN_SECRET }}
          IMAGE_TAG: ${{ inputs.image_tag || 'develop' }}
          MINT_TEST_STACK_PREFIX: ${{ inputs.pod_prefix || '' }}
        run: |
          set -euo pipefail
          STACK_SCRIPT=deploy/tapis/register_mint_stack.py
          if [[ -n "$MINT_TEST_STACK_PREFIX" ]]; then STACK_SCRIPT=deploy/tapis/register_mint_test_stack.py; fi

          # parse_pods preserves dependency order, so use separate invocations
          # to guarantee the migrated database is available before the Model
          # Catalog embedding indexer starts, and the catalog webhook endpoint
          # is available before Hasura metadata is applied.
          python "$STACK_SCRIPT" \
            --image-tag "$IMAGE_TAG" \
            --pods api \
            --restart-pods api \
            --recreate-on-image-mismatch

          python "$STACK_SCRIPT" \
            --image-tag "$IMAGE_TAG" \
            --pods graphql \
            --restart-pods graphql \
            --recreate-on-image-mismatch

      - name: Verify semantic search and Hasura health
        env:
          MINT_TEST_STACK_PREFIX: ${{ inputs.pod_prefix || '' }}
        run: |
          set -euo pipefail
          STACK_PREFIX="${MINT_TEST_STACK_PREFIX:-mintdev}"
          MODEL_CATALOG_ENDPOINT="https://${STACK_PREFIX}api.pods.portals.tapis.io"
          GRAPHQL_ENDPOINT="https://${STACK_PREFIX}graphql.pods.portals.tapis.io"
          curl --fail --silent --show-error --retry 30 --retry-delay 5 \
            --retry-all-errors --connect-timeout 10 --max-time 30 \
            "$MODEL_CATALOG_ENDPOINT/search?q=wildfire&limit=1" >/dev/null
          curl --fail --silent --show-error --retry 30 --retry-delay 5 \
            --retry-all-errors --connect-timeout 10 --max-time 30 \
            "$GRAPHQL_ENDPOINT/healthz" >/dev/null

      - name: Apply Hasura metadata and verify schema
        env:
          HASURA_GRAPHQL_ADMIN_SECRET: ${{ secrets.HASURA_GRAPHQL_ADMIN_SECRET }}
          MINT_TEST_STACK_PREFIX: ${{ inputs.pod_prefix || '' }}
          IMAGE_TAG: ${{ inputs.image_tag || 'develop' }}
        run: |
          set -euo pipefail
          STACK_PREFIX="${MINT_TEST_STACK_PREFIX:-mintdev}"
          GRAPHQL_ENDPOINT="https://${STACK_PREFIX}graphql.pods.portals.tapis.io"

          docker run --rm --pull=always \
            --entrypoint hasura \
            --workdir /hasura \
            --env HASURA_GRAPHQL_ENDPOINT="$GRAPHQL_ENDPOINT" \
            --env HASURA_GRAPHQL_ADMIN_SECRET \
            "ghcr.io/mintproject/graphql-engine:$IMAGE_TAG" \
            metadata apply --skip-update-check

          docker run --rm --pull=always \
            --entrypoint hasura \
            --workdir /hasura \
            --env HASURA_GRAPHQL_ENDPOINT="$GRAPHQL_ENDPOINT" \
            --env HASURA_GRAPHQL_ADMIN_SECRET \
            "ghcr.io/mintproject/graphql-engine:$IMAGE_TAG" \
            metadata reload --skip-update-check

          # A bounded, anonymous read-only schema smoke test catches the
          # role-specific UI regressions without printing rows or GraphQL
          # error payloads.
          response="$(curl --fail --silent --show-error \
            -H "content-type: application/json" \
            --data '{"query":"{ modelcatalog_etl_process(limit: 1) { id contracts(limit: 1, order_by: [{ role: asc }, { position: asc }]) { role standard_variable_uri unit format } } modelcatalog_etl_process_contract(limit: 1) { role } problem_statement(limit: 1) { id events(limit: 1) { event } } }"}' \
            "$GRAPHQL_ENDPOINT/v1/graphql")"
          if [[ "$response" == *'"errors"'* ]]; then
            echo "GraphQL schema smoke test failed" >&2
            exit 1
          fi
          echo "Hasura migrations, metadata, and schema smoke test passed"

      - name: Create or restart dependent application pods
        env:
          TAPIS_USERNAME: ${{ secrets.TAPIS_USERNAME }}
          TAPIS_ID: ${{ secrets.TAPIS_ID }}
          TAPIS_PASSWORD: ${{ secrets.TAPIS_PASSWORD }}
          MINTDEV_POSTGRES_PASSWORD: ${{ secrets.MINTDEV_POSTGRES_PASSWORD }}
          HASURA_GRAPHQL_ADMIN_SECRET: ${{ secrets.HASURA_GRAPHQL_ADMIN_SECRET }}
          IMAGE_TAG: ${{ inputs.image_tag || 'develop' }}
          MINT_TEST_STACK_PREFIX: ${{ inputs.pod_prefix || '' }}
        run: |
          set -euo pipefail
          STACK_SCRIPT=deploy/tapis/register_mint_stack.py
          if [[ -n "$MINT_TEST_STACK_PREFIX" ]]; then
            STACK_SCRIPT=deploy/tapis/register_mint_test_stack.py
            # A prefixed stack is created during this workflow, so its
            # dependent pods may not exist yet. Upsert them and verify the
            # requested branch image before moving to the handoff summary.
            python "$STACK_SCRIPT" \
              --image-tag "$IMAGE_TAG" \
              --pods ui,ensemble,svo \
              --restart-pods ui,ensemble,svo \
              --recreate-on-image-mismatch
          else
            # The shared develop stack must never be created or replaced by
            # this workflow's dependent-pod handoff.
            python "$STACK_SCRIPT" --restart-existing-pods "ui,ensemble,svo"
          fi

      - name: Summary
        run: |
          STACK_PREFIX="${{ inputs.pod_prefix || 'mintdev' }}"
          echo "## MINT dev application pods ready" >> "$GITHUB_STEP_SUMMARY"
          echo "- UI: https://${STACK_PREFIX}ui.pods.portals.tapis.io" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: https://${STACK_PREFIX}api.pods.portals.tapis.io" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ensemble: https://${STACK_PREFIX}ensemble.pods.portals.tapis.io" >> "$GITHUB_STEP_SUMMARY"
          echo "- SVO Adapter: https://${STACK_PREFIX}svo.pods.portals.tapis.io" >> "$GITHUB_STEP_SUMMARY"
