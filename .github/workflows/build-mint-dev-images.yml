name: MINT Dev Images

on:
  push:
    branches: ['**']
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: mint-dev-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Plan changed services
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create change plan
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
              BASE_SHA="$(git rev-list --max-parents=0 HEAD)"
            fi
          fi
          git diff --name-only "$BASE_SHA" "$GITHUB_SHA" > changed_paths.txt
          PLAN="$(python deploy/mint_change_plan.py --source-sha "$GITHUB_SHA" < changed_paths.txt)"
          HAS_CHANGES="$(python -c 'import json,sys; print(str(json.load(sys.stdin)["has_changes"]).lower())' <<< "$PLAN")"
          {
            echo "plan<<PLAN_EOF"
            echo "$PLAN"
            echo "PLAN_EOF"
            echo "has_changes=$HAS_CHANGES"
          } >> "$GITHUB_OUTPUT"
          echo "$PLAN" | python -m json.tool

  build:
    name: Build ${{ matrix.service }}
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.plan).matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          SAFE_BRANCH="${GITHUB_REF_NAME//\//-}"
          IMAGE="ghcr.io/mintproject/${{ matrix.image }}"
          TAGS="${IMAGE}:sha-${SHORT_SHA},${IMAGE}:${SAFE_BRANCH}"
          if [[ "${GITHUB_REF_NAME}" == "${{ github.event.repository.default_branch }}" ]]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build${{ github.event_name != 'pull_request' && ' and push' || '' }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=mint-dev-${{ matrix.service }}
          cache-to: type=gha,scope=mint-dev-${{ matrix.service }},mode=max

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          echo "## ${{ matrix.service }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.tags.outputs.tags }}" | tr ',' '\n' | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"

  publish-change-manifest:
    name: Publish deploy manifest
    needs: [detect-changes, build]
    if: >-
      ${{
        always() &&
        github.event_name != 'pull_request' &&
        needs.detect-changes.result == 'success' &&
        (needs.build.result == 'success' || needs.build.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Write exact change manifest
        env:
          PLAN: ${{ needs.detect-changes.outputs.plan }}
        run: |
          set -euo pipefail
          mkdir -p manifest
          printf '%s\n' "$PLAN" > manifest/changed-services.json
          python -m json.tool manifest/changed-services.json >/dev/null

      - name: Upload exact change manifest
        uses: actions/upload-artifact@v4
        with:
          name: mint-dev-change-plan-${{ github.run_id }}
          path: manifest/changed-services.json
          if-no-files-found: error
          retention-days: 14
