name: MINT Dev Images

# Build all deployable MINT images from one commit so one sha-* tag names the
# whole dev stack. Service-level workflows still run their deeper test suites.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: mint-dev-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: graphql-engine
            image: graphql-engine
            context: graphql_engine
            dockerfile: graphql_engine/Dockerfile
          - service: model-catalog-api
            image: model-catalog-api
            context: model-catalog-api
            dockerfile: model-catalog-api/Dockerfile
          - service: ensemble-manager
            image: ensemble-manager
            context: mint-ensemble-manager
            dockerfile: mint-ensemble-manager/Dockerfile
          - service: ui
            image: ui
            context: ui-react
            dockerfile: ui-react/Dockerfile
          - service: svo-adapter
            image: svo-adapter
            context: svo-adapter-service
            dockerfile: svo-adapter-service/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Compute image tags
        id: tags
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          SAFE_BRANCH="${GITHUB_REF_NAME//\//-}"
          IMAGE="ghcr.io/mintproject/${{ matrix.image }}"
          TAGS="${IMAGE}:sha-${SHORT_SHA},${IMAGE}:${SAFE_BRANCH}"
          if [ "${GITHUB_REF_NAME}" = "${{ github.event.repository.default_branch }}" ]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build${{ github.event_name != 'pull_request' && ' and push' || '' }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=mint-dev-${{ matrix.service }}
          cache-to: type=gha,scope=mint-dev-${{ matrix.service }},mode=max

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          echo "## ${{ matrix.service }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.tags.outputs.tags }}" | tr ',' '\n' | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
