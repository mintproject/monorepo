name: GraphQL Engine

# No path filter, and no test job. No test suite exists for this service, so
# `publish` runs unconditionally on a push. Every single-repo commit builds an
# image for every service, so one tag names the whole system state.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [develop, main]

env:
  IMAGE: ghcr.io/mintproject/graphql-engine

defaults:
  run:
    working-directory: graphql_engine

concurrency:
  group: graphql_engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute sanitized branch tag
        run: |
          SAFE_BRANCH="${GITHUB_REF_NAME}"
          # Docker tags forbid '/', so feature branches publish rather than fail.
          echo "SAFE_BRANCH=${SAFE_BRANCH//\//-}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Dockerfile does `COPY . hasura/`, so the context is the service
      # directory, not the repository root.
      - uses: docker/build-push-action@v6
        with:
          push: true
          context: graphql_engine
          file: graphql_engine/Dockerfile
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ env.SAFE_BRANCH }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Retag, do not rebuild. A second build would ship an artifact nothing saw.
      - name: Tag the default branch as latest
        if: github.ref_name == github.event.repository.default_branch
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:latest" "${IMAGE}:${GITHUB_SHA}"

  scan:
    name: Scan image
    needs: [publish]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: 'HIGH,CRITICAL'
          # Reporting only. A vulnerable base image must not block a deploy.
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload to the Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: graphql_engine
