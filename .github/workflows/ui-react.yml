name: UI React — Build & Test

on:
  push:
    branches: ['**']
    paths:
      - 'ui-react/**'
      - '.github/workflows/ui-react.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'ui-react/**'
      - '.github/workflows/ui-react.yml'

env:
  DOCKER_IMAGE_REPOSITORY: mintproject
  # Deliberately distinct from the legacy UI's mint-ui-lit image, so the two are
  # unmistakable while both exist.
  DOCKER_IMAGE_NAME: mint-ui-react

defaults:
  run:
    working-directory: ui-react

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui-react/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui-react/package-lock.json

      - run: npm ci

      - run: npx tsc -b

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui-react/package-lock.json

      - run: npm ci

      - run: npm test

      - run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ui-react/coverage/
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui-react/package-lock.json

      - run: npm ci

      - run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-react-dist
          path: ui-react/dist/
          retention-days: 7

  publish:
    name: Publish image
    needs: [lint, typecheck, test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tags
        id: tags
        run: |
          # Docker tags forbid '/', so feature branches publish rather than fail.
          SAFE_BRANCH="${GITHUB_REF_NAME//\//-}"
          echo "safe_branch=${SAFE_BRANCH}" >> "$GITHUB_OUTPUT"
          TAGS="${DOCKER_IMAGE_REPOSITORY}/${DOCKER_IMAGE_NAME}:${SAFE_BRANCH}"
          TAGS="${TAGS},${DOCKER_IMAGE_REPOSITORY}/${DOCKER_IMAGE_NAME}:${GITHUB_SHA}"
          if [ "${GITHUB_REF_NAME}" = "${{ github.event.repository.default_branch }}" ]; then
            TAGS="${TAGS},${DOCKER_IMAGE_REPOSITORY}/${DOCKER_IMAGE_NAME}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          context: ui-react
          file: ui-react/Dockerfile
          tags: ${{ steps.tags.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
