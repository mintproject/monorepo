name: UI React — Build & Test

on:
  push:
    branches: [develop, main]
    paths:
      - 'ui-react/**'
      - '.github/workflows/ui-react.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'ui-react/**'
      - '.github/workflows/ui-react.yml'

defaults:
  run:
    working-directory: ui-react

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui-react/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui-react/package-lock.json

      - run: npm ci

      - run: npx tsc -b

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui-react/package-lock.json

      - run: npm ci

      - run: npm test

      - run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ui-react/coverage/
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui-react/package-lock.json

      - run: npm ci

      - run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-react-dist
          path: ui-react/dist/
          retention-days: 7
