#import "../fragments/model-catalog.graphql"
#import "../fragments/region.graphql"

query GetModelTree {
  modelcatalog_software(
    order_by: { label: asc }
    where: { type: { _eq: "https://w3id.org/okn/o/sdm#Model" } }
  ) {
    id
    label
    versions(order_by: { label: asc }) {
      id
      label
      version_id
      configurations(
        order_by: { label: asc }
        where: { model_configuration_id: { _is_null: true } }
      ) {
        id
        label
        child_configurations(order_by: { label: asc }) {
          id
          label
        }
      }
    }
  }
}

query GetConfiguration($id: String!) {
  modelcatalog_configuration_by_pk(id: $id) {
    ...ConfigurationFields
  }
}

# Server-side faceted search over configurations + setups (flat result set,
# grouped into Model -> Configuration -> Setup on the client). The $where is
# assembled in TypeScript from the active text/facet filters.
query SearchModelConfigurations($where: modelcatalog_configuration_bool_exp!) {
  modelcatalog_configuration(where: $where, order_by: { label: asc }, limit: 500) {
    id
    label
    model_configuration_id
    software_version {
      version_id
      software {
        id
        label
      }
    }
    parent_configuration {
      id
      label
      software_version {
        version_id
        software {
          id
          label
        }
      }
    }
  }
}

# Resolve a deep-link slug (trailing URI segment) back to a full configuration id.
query GetConfigurationBySlug($pattern: String!) {
  modelcatalog_configuration(where: { id: { _ilike: $pattern } }, order_by: { id: asc }, limit: 1) {
    id
  }
}

# Facet option sources. Counts are intentionally omitted: the runtime anonymous
# Hasura role exposes no _aggregate fields. Output-variable options are deduped
# client-side from the configuration_output -> standard_variable path.
query GetModelCategoryOptions {
  modelcatalog_model_category(order_by: { label: asc }) {
    id
    label
  }
}

query GetOutputVariableOptions {
  modelcatalog_configuration_output {
    output {
      presentations {
        presentation {
          standard_variable {
            id
            label
          }
        }
      }
    }
  }
}

query PrefetchReferenceData {
  modelcatalog_standard_variable(order_by: { label: asc }) {
    id
    label
    description
  }
  modelcatalog_unit(order_by: { label: asc }) {
    id
    label
  }
}

query GetPersons($search: String) {
  modelcatalog_person(
    order_by: { label: asc }
    where: { label: { _ilike: $search } }
    limit: 50
  ) {
    id
    label
    name
  }
}

query GetRegions {
  modelcatalog_region(order_by: { label: asc }) {
    id
    label
  }
}

query GetVariablePresentations {
  modelcatalog_variable_presentation(order_by: { label: asc }) {
    id
    label
    has_long_name
    has_short_name
    standard_variable {
      id
      label
      description
    }
    unit {
      id
      label
    }
  }
}

query GetModelFamilies {
  modelcatalog_software(
    order_by: { label: asc }
    where: { type: { _eq: "https://w3id.org/okn/o/sdm#Model" } }
  ) {
    id
    label
    versions(order_by: { label: asc }) {
      id
      label
      version_id
    }
  }
}
