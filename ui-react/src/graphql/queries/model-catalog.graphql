#import "../fragments/model-catalog.graphql"
#import "../fragments/region.graphql"

# No type predicate — deliberate. `modelcatalog_software.type` classifies a model
# (Empirical, Coupled, Theory-Guided, ...); it does not say whether a row is a model.
# The ETL only migrated `?id a sdm:Model` and stored the most specific subtype, and
# rows created through the REST API's generic `softwares` resource carry the
# superclass `sd#Software`. Filtering on any one value hides real models. See #98.
query GetModelTree {
  modelcatalog_software(order_by: { label: asc }) {
    id
    label
    versions(order_by: { label: asc }) {
      id
      label
      version_id
      configurations(
        order_by: { label: asc }
        where: { model_configuration_id: { _is_null: true } }
      ) {
        id
        label
        child_configurations(order_by: { label: asc }) {
          id
          label
        }
      }
    }
  }
}

query GetConfiguration($id: String!) {
  modelcatalog_configuration_by_pk(id: $id) {
    ...ConfigurationFields
  }
}

# Server-side faceted search over configurations + setups (flat result set,
# grouped into Model -> Configuration -> Setup on the client). The $where is
# assembled in TypeScript from the active text/facet filters.
query SearchModelConfigurations($where: modelcatalog_configuration_bool_exp!) {
  modelcatalog_configuration(where: $where, order_by: { label: asc }, limit: 500) {
    id
    label
    model_configuration_id
    software_version {
      id
      version_id
      software {
        id
        label
      }
    }
    parent_configuration {
      id
      label
      software_version {
        id
        version_id
        software {
          id
          label
        }
      }
    }
  }
}

# Resolve a deep-link slug (trailing URI segment) back to a full configuration id.
query GetConfigurationBySlug($pattern: String!) {
  modelcatalog_configuration(where: { id: { _ilike: $pattern } }, order_by: { id: asc }, limit: 1) {
    id
  }
}

# Facet option sources. Counts are intentionally omitted: the runtime anonymous
# Hasura role exposes no _aggregate fields. Output-variable options are deduped
# client-side from the configuration_output -> standard_variable path.
query GetModelCategoryOptions {
  modelcatalog_model_category(order_by: { label: asc }) {
    id
    label
  }
}

query GetOutputVariableOptions {
  modelcatalog_configuration_output {
    configuration_id
    output_id
    output {
      id
      presentations {
        dataset_specification_id
        presentation_id
        presentation {
          id
          standard_variable {
            id
            label
          }
        }
      }
    }
  }
}

query PrefetchReferenceData {
  modelcatalog_standard_variable(order_by: { label: asc }) {
    id
    label
    description
  }
  modelcatalog_unit(order_by: { label: asc }) {
    id
    label
  }
}

query GetPersons($search: String) {
  modelcatalog_person(order_by: { label: asc }, where: { label: { _ilike: $search } }, limit: 50) {
    id
    label
    name
  }
}

query GetRegions {
  modelcatalog_region(order_by: { label: asc }) {
    id
    label
  }
}

query GetVariablePresentations {
  modelcatalog_variable_presentation(order_by: { label: asc }) {
    id
    label
    has_long_name
    has_short_name
    standard_variable {
      id
      label
      description
    }
    unit {
      id
      label
    }
  }
}

query GetStandardVariablesWithUnits {
  modelcatalog_standard_variable(order_by: { label: asc }) {
    id
    label
    description
    same_as
    variable_presentations {
      id
      unit {
        id
        label
      }
    }
  }
}

# No type predicate — same rule as GetModelTree above (#98). This feeds the
# "Model Family" picker on registration; filtering it made it impossible to
# register a new version under any model whose type is a subtype of sdm#Model.
query GetModelFamilies {
  modelcatalog_software(order_by: { label: asc }) {
    id
    label
    versions(order_by: { label: asc }) {
      id
      label
      version_id
    }
  }
}

# The standard variables a thread can pick as its indicator: those produced by a
# configuration the Models step actually lists.
#
# The `where` clause repeats the walk GetModelTreeWithRegions makes
# (src/graphql/generated/modeling.ts) so the two lists cannot drift. The Models
# step shows leaf rows only, which are either a top-level configuration that
# hangs off a software version and has no children, or a setup whose parent
# hangs off a version. TACC holds 89 configurations with no version at all; the
# tree never lists them, so an indicator only they produce is a dead end.
#
# Do not use GetOutputVariableOptions here. It walks every configuration_output
# with no tree rule, so at TACC it offers 148 where the tree reaches 147 — the
# extra one comes from the orphan configuration pihm_flooding.
#
# `distinct_on` returns one row per presentation instead of one per
# (dataset_specification, presentation) pair: 357 rows / 113 KB against TACC,
# where the undeduped form returns 2781 rows / 942 KB.
query GetIndicatorVariableOptions {
  modelcatalog_dataset_specification_presentation(
    distinct_on: presentation_id
    order_by: { presentation_id: asc }
    where: {
      dataset_specification: {
        configuration_outputs: {
          configuration: {
            _or: [
              { software_version_id: { _is_null: false }, _not: { child_configurations: {} } }
              { parent_configuration: { software_version_id: { _is_null: false } } }
            ]
          }
        }
      }
    }
  ) {
    dataset_specification_id
    presentation_id
    presentation {
      id
      standard_variable {
        id
        label
        description
      }
    }
  }
}

# The standard variables a thread can pick as its adjustable variable.
#
# The knowledge base defines a driver (TD) as "input variables or adjustable
# parameters" (knowledge-base/wiki/goal-oriented-modeling.md), so this reads both
# paths and the client takes the union. Against TACC: 154 inputs, 28 adjusted by
# a parameter, 161 distinct. Both root fields use the same leaf-configuration
# rule as GetIndicatorVariableOptions, and both ride in one round trip.
query GetDriverVariableOptions {
  inputs: modelcatalog_dataset_specification_presentation(
    distinct_on: presentation_id
    order_by: { presentation_id: asc }
    where: {
      dataset_specification: {
        configuration_inputs: {
          configuration: {
            _or: [
              { software_version_id: { _is_null: false }, _not: { child_configurations: {} } }
              { parent_configuration: { software_version_id: { _is_null: false } } }
            ]
          }
        }
      }
    }
  ) {
    dataset_specification_id
    presentation_id
    presentation {
      id
      standard_variable {
        id
        label
        description
      }
    }
  }
  adjusted: modelcatalog_parameter_adjusts_variable(
    distinct_on: variable_id
    order_by: { variable_id: asc }
    where: {
      parameter: {
        configuration_parameters: {
          configuration: {
            _or: [
              { software_version_id: { _is_null: false }, _not: { child_configurations: {} } }
              { parent_configuration: { software_version_id: { _is_null: false } } }
            ]
          }
        }
      }
    }
  ) {
    parameter_id
    variable_id
    variable {
      id
      standard_variable {
        id
        label
        description
      }
    }
  }
}
