events {}

http {
  upstream tapis_auth_webhook {
    server auth-webhook:3000;
  }

  server {
    listen 3000;

    location = /healthz {
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    location = /auth-webhook {
      proxy_pass http://tapis_auth_webhook/auth-webhook;

      # Hasura forwards the client headers to the GET auth hook. Convert that
      # request to the POST envelope required by the Tapis webhook. This keeps
      # large GraphQL request bodies away from the auth image's small JSON
      # parser while preserving the bearer token.
      proxy_method POST;
      proxy_set_body '{"headers":{"Authorization":"$http_authorization"},"body":{}}';
      proxy_set_header Transfer-Encoding "";
      proxy_set_header Content-Type application/json;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Hasura-Admin-Secret $http_x_hasura_admin_secret;
      proxy_set_header X-Hasura-Role $http_x_hasura_role;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
